name: Nova Instruments
description: >-
  Nova Instruments is a test-and-measurement platform company that designs,
  develops, and manufactures instruments and systems for analyzing fluid and
  solid mechanics. It operates a family of established brands — Brookhaven
  Instruments, Dantec Dynamics, DegreeC, NDT Systems, Phoenix Inspection
  Systems, Technology Design, and Stresstech — spanning particle
  characterization, optical measurement, thermal management, and
  non-destructive testing. A portfolio company of Battery Ventures since 2010,
  it operates as part of the Nova Ventures Group. As a hardware-focused
  instruments manufacturer, Nova Instruments does not currently publish a
  public web API, developer portal, or OpenAPI surface.
